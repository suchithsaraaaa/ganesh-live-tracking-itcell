<svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lord Ganesha line art">
  <!-- Crown -->
  <path d="M42 14 Q50 4 58 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  <circle cx="50" cy="8" r="1.6" fill="currentColor" />

  <!-- Head -->
  <circle cx="50" cy="30" r="13" stroke="currentColor" stroke-width="1.6" />

  <!-- Ears -->
  <path d="M37 22 Q22 20 24 34 Q26 44 38 38" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M63 22 Q78 20 76 34 Q74 44 62 38" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Eyes -->
  <path d="M44 29 q2 -2 4 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
  <path d="M52 29 q2 -2 4 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />

  <!-- Trunk -->
  <path d="M46 37 Q44 46 50 50 Q58 55 52 62 Q48 66 42 63" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tusk -->
